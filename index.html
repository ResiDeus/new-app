<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora PWA</title>
  
  <!-- Icono Apple -->
  <link rel="apple-touch-icon" href="https://flaticon.com">

  <!-- Configuración PWA Completa (Inyectada inline para GitHub Pages sin archivos extra) -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Calculadora%20de%20Sumas%22,%22short_name%22:%22Sumadora%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%2300e676%22,%22icons%22:[{%22src%22:%22https://flaticon.com},{%22src%22:%22https://flaticon.com%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Calculadora */
    .calc-container {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 340px;
      text-align: center;
      border: 1px solid #2d2d2d;
    }

    h2 { margin-top: 0; color: #00e676; }

    input[type="number"] {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1.3rem;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }
    input[type="number"]:focus { border-color: #00e676; }

    .btn-sumar {
      width: 100%;
      padding: 15px;
      background-color: #00e676;
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .resultado-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #252525;
      border-radius: 10px;
      border-left: 5px solid #00e676;
    }
    .resultado-box strong { font-size: 2rem; }

    /* Pantalla de Bloqueo Móvil */
    .bloqueo-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      z-index: 99999;
      text-align: center;
      padding: 20% 20px 0 20px;
      box-sizing: border-box;
    }

    .bloqueo-screen h1 { font-size: 2.2rem; color: #00e676; }
    .bloqueo-screen p { color: #ccc; line-height: 1.6; max-width: 400px; margin: 0 auto; }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO (SE MUESTRA SI ABREN DESDE NAVEGADOR WEB MÓVIL) -->
  <div id="pantalla-bloqueo" class="bloqueo-screen">
    <h1>📲 Aplicación Disponible</h1>
    <p><br>
      Mira la parte superior de tu navegador o pulsa el aviso de <b>"App disponible"</b> para agregar esta calculadora a tu pantalla de inicio.<br><br>
      Si no lo ves, abre el menú de opciones (los 3 puntos o compartir) y selecciona <b>"Instalar"</b> o <b>"Añadir a pantalla de inicio"</b>.
    </p>
  </div>

  <!-- APLICACIÓN PRINCIPAL (CALCULADORA) -->
  <div class="calc-container">
    <h2>➕ Solo Sumas</h2>
    <input type="number" id="num1" placeholder="Primer número" inputmode="numeric">
    <input type="number" id="num2" placeholder="Segundo número" inputmode="numeric">
    <button class="btn-sumar" onclick="realizarSuma()">Calcular Suma</button>
    <div class="resultado-box">
      <strong id="resultado">0</strong>
    </div>
  </div>

  <script>
    function realizarSuma() {
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      document.getElementById('resultado').innerText = n1 + n2;
    }

    function comprobarAcceso() {
      const pantalla = document.getElementById('pantalla-bloqueo');

      // Detectar si está abierta como App instalada en el Escritorio (PWA Standalone)
      const estaInstalada = window.matchMedia('(display-mode: standalone)').matches || 
                            window.matchMedia('(display-mode: fullscreen)').matches || 
                            window.navigator.standalone === true; 

      if (!estaInstalada) {
        // Si está en el navegador (móvil o PC), activamos el bloqueo de fondo
        // Esto fuerza al usuario a usar el botón superior del navegador para desbloquearla
        pantalla.style.display = 'block';
      } else {
        pantalla.style.display = 'none';
      }
    }

    // Al NO bloquear el evento 'beforeinstallprompt', el navegador activará 
    // automáticamente su icono de instalación en la barra superior (Omnibox)
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log("El banner e icono superior del navegador se han activado.");
    });

    window.onload = comprobarAcceso;
  </script>

  <!-- Service Worker Inline obligatorio para activar los avisos del navegador -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('data:text/javascript,self.addEventListener(%22fetch%22,eval);');
    }
  </script>
</body>
</html>
